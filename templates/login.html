{% extends "base.html" %}

{% block title %}Sign In - AI Career Copilot{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h1 class="auth-title">Sign In</h1>
            <p class="auth-subtitle">Access your personalized career dashboard and reports</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form" autocomplete="off">
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="student@college.edu"
                    value="{{ email or '' }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Sign In
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account yet? <a href="{{ url_for('signup') }}" class="auth-link">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
